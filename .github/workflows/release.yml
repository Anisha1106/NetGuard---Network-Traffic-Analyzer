name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libpcap-dev

      - name: Configure CMake (Release)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=ON

      - name: Build project
        run: |
          cmake --build build --parallel $(nproc)

      - name: Run tests
        run: |
          ./build/tests/netguard_tests

      - name: Package release archive
        run: |
          mkdir -p dist
          cp -r build dist/build
          cp -r config dist/config
          cp README.md dist/README.md
          tar -czf netguard-${GITHUB_REF_NAME:-dev}.tar.gz -C dist .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: netguard-release
          path: netguard-${{ github.ref_name || 'dev' }}.tar.gz

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: netguard-${{ github.ref_name }}.tar.gz
          draft: false
          generate_release_notes: true
